case: Human_Brain_prefrontal_cortex_151507

dataset:
  type: ST2D
  data_file: data/random/Human_Brain_prefrontal_cortex_151507/Human_Brain_prefrontal_cortex_151507_aealign_with_embeddings_phikon_zlocal.h5ad
  val_proportion: 0.2
  keep_ratio: True
  require_coordnorm: False
  local_key: z_local

pipeline:
  target: embeddings

  inr:
    model: SIREN
    num_hidden_layers: 3
    num_hidden_features: 2048
    phase: 1000

    conditioning:
      mode: film_output
      hidden_dim: 256
      dropout: 0.0

    decoder:
      ckpt: log/random/Human_Brain_prefrontal_cortex_151507/aealign/lightning_logs/version_0/checkpoints/best-199.ckpt
      recon_loss: True
      finetune: True
      dice_lambda: 0.01

  optimization:
    seed: 8848
    epochs: 2000
    lr: 0.0001
    val_freq: 50
    logs: log/random/Human_Brain_prefrontal_cortex_151507/inr_aealign_film_zlocal_siren
    batch_size: 8192
    num_workers: 0

  predict_mode: val
  reconstructed_data: reconstructed-val.h5ad
